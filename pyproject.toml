[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vitera"
version = "0.1.0"
description = "Concurrent BPJS claim verification for Indonesian hospital inpatient episodes"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "numpy>=1.26",
    "pandas>=2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
]
intake = [
    # Paper intake: FPK rendering and scan simulation.
    "reportlab>=4.0",
    "pillow>=10.0",
]
intake-macos = [
    # Apple Vision, the OCR backend the reported numbers were measured on.
    # macOS only, hence its own extra: `pip install -e ".[intake]"` gets a
    # working render and cache-replay path on any platform, and this adds the
    # ability to record a fresh read. A tesseract backend covers Linux.
    "pyobjc-framework-Vision>=10.0",
]
ml = [
    "torch>=2.4",
    "transformers>=4.44",
    "scikit-learn>=1.5",
    "scipy>=1.11",
    # BM25 is implemented in src/vitera/models/bm25.py rather than pulled in:
    # forty lines, one fewer dependency inside a reproducibility claim, and the
    # tokeniser has to handle Indonesian clinical shorthand and ICD codes anyway.
]

[tool.hatch.build.targets.wheel]
packages = ["src/vitera"]

[tool.ruff]
line-length = 88
src = ["src", "tests", "experiments"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
# Contracts are the point of this package; do not let stubs erode them.
disallow_untyped_defs = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["yaml", "pandas.*", "numpy.*", "scipy.*", "sklearn.*", "torch.*", "transformers.*"]
ignore_missing_imports = true

# Paper intake. reportlab ships no stubs; Vision/Foundation are pyobjc bridges
# to Objective-C frameworks and cannot meaningfully have any. Both are used
# behind narrow adapters (`intake.render`, `intake.scan._vision`) precisely so
# the untyped surface stays one function wide.
[[tool.mypy.overrides]]
module = ["reportlab.*", "Vision", "Quartz", "Foundation", "PIL.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
