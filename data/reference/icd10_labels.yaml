# ICD-10 labels for codes that appear on a CLAIM but never in the record.
#
# The cross-encoder (bucket 8) scores a pair: (coded diagnosis, clinical
# evidence). The left side of that pair is rendered from the code's Indonesian
# label, so every code a claim can carry needs one — including the sibling
# codes that defect injection substitutes in (D2) and the codes it invents
# (D3 / D7). Codes that also exist in comorbidities.yaml or cbg_groups.yaml are
# NOT repeated here; `reference.icd10_label` falls through to those first.
#
# Why this matters for the result: if a sibling's label were left blank or set
# to the code string, the cross-encoder would separate D2 pairs on the presence
# of a label rather than on clinical specificity, and the D2 number would be an
# artifact. The labels below are therefore deliberately close in wording to
# their siblings — that closeness is the difficulty of the task.
#
# ⚠ DOMAIN REVIEW REQUIRED — Jason owns correctness. Every label below is a
# plausible Indonesian rendering written without an ICD-10 volume at hand.
# `verified` must be flipped before any per-class D2 figure enters the paper.

schema_version: 1
verified: false        # ← Jason flips this after checking against ICD-10 vol. 1

labels:
