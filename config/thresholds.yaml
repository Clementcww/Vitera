# Every threshold in Vitera. None of these values may appear in code or in a
# prompt. The router reads this file; models never see it.
#
# The router values below were SET IN BUCKET 8 from the calibration curve, by
# `calibrate.recommend_thresholds`, and are reproduced by:
#
#     make train && make baselines        # -> results/cross_encoder.json
#
# They replace the bucket-2 placeholders (default 0.60/0.40,
# high_precision 0.80/0.55), which were never measured.
#
# READ THIS BEFORE CHANGING THEM — three things about these numbers are
# surprising and all three are real:
#
# 1. They are TINY. Scores are calibrated and then shifted from the training
#    prior (0.418 positive) to the deployment prior (0.10), which compresses
#    everything toward zero. 0.0015 is not "flag almost everything"; it is the
#    point at which 9.8% of correctly coded diagnoses get queried, which is the
#    false-positive budget we chose.
# 2. They are chosen from a FALSE-POSITIVE BUDGET, not from a symmetric
#    metric. Over-flagging is what gets a monitoring product switched off, so
#    the budget is the primary control and recall is the consequence.
# 3. `abstain_below == flag_at`, so the ABSTAIN band is currently EMPTY. The
#    cross-encoder separates this corpus so well that the recall threshold sits
#    above the false-positive threshold — `bands_crossed: true` in the results.
#    Abstention is still reachable in code (architectural rule 10); it simply is
#    not exercised on synthetic data. On a corpus with real clinical prose it
#    will be, and these two values will separate.

schema_version: 1

deployment_prior:
  # Share of codes correct in the wild. Used to correct decision thresholds
  # away from the balanced-training operating point.
  codes_correct: 0.90
  source: "TODO bucket 3 — cite or mark as assumption in docs/CLAIMS.md"

router:
  default:
    # Measured: FPR on supported codes 0.098, recall 0.998, precision 0.887.
    flag_at: 0.0015        # score >= this becomes a Flag
    abstain_below: 0.0015  # score in [abstain_below, flag_at) -> Verdict.ABSTAIN
    max_flags_per_episode: 12

  high_precision:
    # Used when the clean-claim false positive rate matters more than recall,
    # e.g. the first weeks of a hospital deployment.
    # Measured: FPR 0.020, recall 0.985, precision 0.974.
    flag_at: 0.0152
    abstain_below: 0.0152
    max_flags_per_episode: 6

severity:
  # Minimum score for a flag to be treated as escalated by the sweep diff.
  escalate_at: 0.75

alert_fatigue:
  # A breach is a defect, not a tuning opportunity. See the design brief, sweep metrics.
  max_alerts_per_episode_per_day: 3
  max_flag_churn_rate: 0.15

intake:
  # Paper intake (FPK OCR). These gate what a scanned form is allowed to hand
  # to the rest of the system, and they are here rather than in code for the
  # same reason the router's are: a hospital that scans at 150 dpi on a tired
  # MFP will need to move them, and moving them must be visible in a diff.
  #
  # `min_field_confidence` is the OCR engine's own confidence, not a
  # calibrated probability. Apple Vision reports it coarsely — in practice
  # 0.3 / 0.5 / 1.0 — so this is a floor on "the engine was not guessing",
  # not a probability of correctness. Do not report it as one.
  min_field_confidence: 0.3
  # Below this share of rincian rows read completely, the batch goes back to
  # the scanner rather than into the pipeline. Measured on a clean 200 dpi
  # render the rate is ~0.98; the floor is set for degraded scans.
  min_rows_complete: 0.80
  # A form whose printed total and whose rows disagree by more than this is a
  # read failure or an arithmetic error, and either way is not safe to reason
  # over. Zero: the two are the same number by construction.
  max_total_mismatch_idr: 0
  # Service types this build is scoped to. RITP (FKTP) and outpatient are out
  # of scope by design, not by omission — see the design brief, locked decisions.
  accepted_jenis_pelayanan: ["RITL"]

budget:
  # rule 9, per episode
  max_tool_calls: 8
  max_reflections: 1
  wall_clock_seconds: 20.0
  # cohort-level ceiling, per sweep night. Breach ends the sweep as `partial`.
  max_llm_calls_per_sweep: 500
